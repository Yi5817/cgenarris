name: tests

on:
  push:
    branches: [master]
  pull_request:

# Cancel a run that a newer push to the same branch or PR has superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Open MPI
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=mpicc

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  python-api:
    name: Python API (SWIG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Open MPI and SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin swig

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install setuptools numpy ase pytest mpi4py

      - name: Build pygenarris_mpi in place
        working-directory: python
        run: python setup.py build_ext --inplace

      - name: Run tests on 1 rank
        run: python -m pytest -v tests/test_python_api.py

      - name: Run tests on 2 ranks
        run: mpirun -n 2 --oversubscribe python -m pytest -q tests/test_python_api.py
